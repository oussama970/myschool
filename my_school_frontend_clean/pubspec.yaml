# Fichier de configuration Flutter (pubspec.yaml)
# Définit les dépendances, l'icône, la version et les ressources de l'application

name: my_school_frontend
description: "My School - Application éducative pour la gestion des cours, devoirs et communication école-parents"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design - Composants d'interface utilisateur et animations
  cupertino_icons: ^1.0.6          # Icônes style iOS pour compatibilité
  google_fonts: ^6.1.0             # Polices Google Fonts personnalisables
  flutter_svg: ^2.0.7              # Affichage d'images SVG vectorielles
  lottie: ^2.6.0                   # Animations Lottie (JSON)
  shimmer: ^3.0.0                  # Effet de chargement shimmer
  animated_text_kit: ^4.2.2        # Animations de texte variées
  flutter_rating_bar: ^4.0.1       # Barre de notation par étoiles
  open_file: ^3.3.2                # Ouverture de fichiers avec l'app par défaut
  
  # Navigation & State Management - Gestion d'état et navigation
  provider: ^6.0.0                 # Gestion d'état Provider
  
  # Networking - Communication réseau
  http: ^1.1.0                     # Requêtes HTTP client
  connectivity_plus: ^5.0.0        # Vérification de la connexion internet
  socket_io_client: ^3.1.4         # WebSocket client pour messages temps réel
  
  # Storage & Permissions - Stockage local et permissions
  shared_preferences: ^2.2.0       # Stockage persistant clé-valeur
  path_provider: ^2.1.0            # Accès aux chemins du système de fichiers
  image_picker: ^1.0.5             # Sélection d'images (galerie/caméra)
  file_picker: ^8.1.7              # Sélection de fichiers depuis le système
  permission_handler: ^11.0.1      # Gestion des permissions Android/iOS
  
  # PDF Export - Export PDF
  pdf: ^3.10.7                     # Génération de documents PDF
  printing: ^5.11.1                # Impression de PDF
  
  # Calendar & Charts - Calendrier et graphiques
  table_calendar: ^3.0.9           # Widget calendrier interactif
  fl_chart: ^0.68.0                # Graphiques et chartes personnalisables
  
  # Utilitaires - Outils divers
  intl: ^0.18.0                    # Internationalisation et formatage des dates
  url_launcher: ^6.1.0             # Ouverture d'URLs externes
  share_plus: ^7.0.0               # Partage de contenu vers autres apps
  badges: ^3.1.1                   # Badges de notification sur icônes
  qr_flutter: ^4.1.0               # Génération de codes QR
  
  # Cache & Images - Gestion du cache et des images
  cached_network_image: ^3.2.0     # Mise en cache des images réseau

dev_dependencies:
  flutter_test:
    sdk: flutter                    # Framework de test Flutter
  flutter_lints: ^3.0.0             # Règles de linting Flutter

flutter:
  uses-material-design: true       # Utilise les icônes Material Design
  
  assets:
    - assets/images/               # Dossier des images
    - assets/images/background.jpg # Image de fond
    - assets/icons/                # Dossier des icônes
    - assets/animations/           # Dossier des animations Lottie