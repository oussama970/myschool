name: my_school_frontend
description: "My School - Application éducative pour la gestion des cours, devoirs et communication école-parents"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  lottie: ^2.6.0
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2
  flutter_rating_bar: ^4.0.1
  open_file: ^3.3.2
  
  # Navigation & State Management
  provider: ^6.0.0
  
  # Networking
  http: ^1.1.0
  connectivity_plus: ^5.0.0
  socket_io_client: ^3.1.4
  
  # Storage & Permissions
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  image_picker: ^1.0.5
  file_picker: ^8.1.7
  permission_handler: ^11.0.1
  
  # PDF Export
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Calendar & Charts
  table_calendar: ^3.0.9
  fl_chart: ^0.68.0
  
  # Utilitaires
  intl: ^0.18.0
  url_launcher: ^6.1.0
  share_plus: ^7.0.0
  badges: ^3.1.1
  qr_flutter: ^4.1.0
  
  # Cache & Images
  cached_network_image: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/background.jpg
    - assets/icons/
    - assets/animations/